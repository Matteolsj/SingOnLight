<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SingOnLight - Story</title>
    <link rel="icon" href="/static/images/favicon.ico">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="parent">
        <div class="div1">
            <div class="div1a">
                <a class="indexBTN" href="/">Main Menu</a><br>
                <a class="playBTN" id="currentBTN" href="/modes">Game Modes</a><br>
                <a class="calibrationBTN" href="/calibration">Calibration</a><br>
                <a class="dataBTN" href="/data">Data</a><br>
                <a class="creationBTN" href="/rhythm/create">Create Your Own Rhythm!</a><br>
                <a href="https://github.com/Matteolsj/SingOnLight" target="_blank" rel="noopener noreferrer"
                    class="github">GitHub</a>

            </div>
        </div>
        <div class="div2">
            <button hidden id="storyButton" class="start" onclick="show_story_animation()">Play</button>

            <img id="gifDragon" src="/static/images/next_level.gif" alt="The dragon flies to the next level"
                class="hidden">
            <img id="gameOver" src="/static/images/game_over.png" alt="Game over" class="hidden">
            <img id="victory" src="/static/images/victory.png" alt="Victory" class="hidden">

            <script>
                document.addEventListener("DOMContentLoaded", function () {
                    document.getElementById("storyButton").click();
                });
            </script>

            <p>You are on level <span id="level">1</span></p>
        </div>
    </div>
    <script src="/static/js/app.js"></script>
</body>

</html>
